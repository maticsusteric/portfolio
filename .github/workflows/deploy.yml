name: Deploy to GitHub Pages

# The site's source is private (maticsusteric/portfolio-src). This repo only builds and hosts
# it, and takes Phantom claims as issues (phantom-claim.yml).
on:
  # portfolio-src triggers this on every push to master (its trigger-deploy.yml).
  workflow_dispatch:
  # Twice a day, so the ISS flies from fresh orbital elements (scripts/iss-tle.mjs).
  schedule:
    - cron: '23 5,17 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: maticsusteric/portfolio-src
          ref: master
          token: ${{ secrets.SOURCE_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # If CelesTrak is down, the committed elements still work (the ISS hides past 14 days).
      - run: node scripts/iss-tle.mjs
        continue-on-error: true
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub pauses scheduled workflows after 60 days without activity in the repo they live in,
  # and every real commit goes to portfolio-src. An empty commit every 40 days keeps the
  # schedule (and the ISS) alive.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled deploy alive"
            git push
          fi
